<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Animation and File Fixture Demo</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #08111f; color: #e7f0ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    main { position: relative; width: min(92vw, 760px); padding: 3rem; border: 1px solid #34506e; border-radius: 24px; background: #101e31e8; box-shadow: 0 24px 100px #0008; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.04em; }
    p { max-width: 55ch; color: #b7c9df; }
    .orb { position: absolute; z-index: -1; width: 120px; aspect-ratio: 1; border-radius: 50%; filter: blur(2px); background: radial-gradient(circle at 35% 30%, #b4f3ff, #4aa8ff 45%, #6b4cff 75%); animation: drift 8s ease-in-out infinite alternate; opacity: .8; }
    .orb.one { top: -34px; right: 12%; }
    .orb.two { bottom: -45px; left: 8%; width: 85px; animation-delay: -3s; }
    .pulse { display: inline-flex; align-items: center; gap: .6rem; margin-top: 1rem; padding: .55rem .9rem; border: 1px solid #4d759a; border-radius: 999px; color: #c9e6ff; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #69f0c1; box-shadow: 0 0 14px #69f0c1; animation: blink 1.4s infinite; }
    canvas { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; }
    @keyframes drift { to { transform: translate(40px, 24px) scale(1.15); } }
    @keyframes blink { 50% { opacity: .3; transform: scale(.7); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main>
    <div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
    <h1>Animation demo</h1>
    <p>A lightweight, self-contained animation for checking that this local test repository renders HTML, CSS motion, and a small canvas effect.</p>
    <p>The repository also contains 1,000 small text fixtures. This is a local development sample, not a GitHub service stress test.</p>
    <span class="pulse"><i class="dot" aria-hidden="true"></i> Running locally</span>
  </main>
  <script>
    const canvas = document.querySelector('#stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = canvas.width = innerWidth * dpr; h = canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.min(90, Math.floor(innerWidth / 14)) }, () => ({ x: Math.random()*innerWidth, y: Math.random()*innerHeight, r: Math.random()*1.5+.3, v: Math.random()*.25+.05 }));
    }
    function draw() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) { s.y -= s.v; if (s.y < 0) { s.y = innerHeight; s.x = Math.random()*innerWidth; } ctx.fillStyle = 'rgba(180,210,255,.7)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); }
      requestAnimationFrame(draw);
    }
    addEventListener('resize', resize); resize(); draw();
  </script>
</body>
</html>
